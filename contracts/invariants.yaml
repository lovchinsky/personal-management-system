    verifiable_by: ci-contract
    test: app/test/contract/inv-037.spec.ts
    related: [INV-209, INV-315]
    notes: "Mechanical in two parts: the router of the run entry names exactly the frames of `run_frames` and a file for each, and the files a situation reads first stay under its ceiling. Whether every sentence in them is needed stays an editorial judgement. Context is the Skill file tree in `docs/2-system.md` § “Decomposition”."

