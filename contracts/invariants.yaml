  - id: INV-025
    statement: "The App MCP provides the system with a closed list of intents in canonical terms: a comment, conversion of an Inbox item, closing an Inbox item, execution of an approved change and a memory write; through these and only these the system writes to Notion and GBrain on its own behalf."
    origin:
      - docs/2-system.md § Preconditions and executor
    verifiable_by: manual
    test: null
    related: [INV-028, INV-055, INV-056, INV-058, INV-220]
    notes: "INV-220 states the same rule as a release criterion; the INV-2xx band owns that wording. Classified manual, not ci-contract: whether a NEW App MCP tool duplicates a native domain operation is a design-review judgement. The enumerable part is INV-028, which is ci-contract. The voice picks the interface (ADR 0017, ADR 0035): the system's comment and its memory entry through App are intents of the system, not facades over the person's operations — the closed list is `mcp_toolsets.app.system_voice` plus the executor of an approved change. Parking a statement of the person in Inbox and carrying the person's channel reply into a thread are bot writes outside the list: they decide nothing about existing state, they only move the person's words into Notion."

  - id: INV-026
    statement: "`pending_actions` holds the proposal of an autonomous run from the time it is made: the run ends together with the model, and the row is the only carrier of the executable change until the person replies. The table is not an attention surface: the person sees a pending proposal in Notion. A proposal from the chat stays an Inbox item (`INV-015`)."
    origin:
      - docs/2-system.md § Approval differs by who performs the write
    verifiable_by: ci-contract
    test: app/test/integration/scen-19-44.spec.ts
    related: [INV-015, INV-057]
    notes: >-
      The ci-contract check covers the first clause: the row exists from the time the
      proposal is made, and its effects are frozen. “A proposal from the chat
      does not become a row” is proven by `app/test/contract/inv-015.spec.ts`.
      The rest is not the named test's subject: that test makes no calls to
      Notion, so “The table is not an attention surface” and “A proposal from the
      chat stays an Inbox item” are proven by `app/src/mcp/server/chat-session.spec.ts`
      (the item is parked at once) and `INV-313` (the chat has no proposal tool).

  - id: INV-027
    statement: "A conflict returns `conflict`; the model makes a new proposal and does not repeat the old one."
