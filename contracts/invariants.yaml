    verifiable_by: ci-contract
    test: app/test/contract/inv-036.spec.ts
    related: [INV-210]
    notes: "The validator is unit-testable over trace fixtures (ci-contract). Whether real runs satisfy it is an eval metric, not a CI gate."

  - id: INV-037
    statement: "Every Skill entry contains only what its situation needs: the run entry holds the files of its `mode`, the Chat entry holds the files of the conversation situation. The rest is progressive disclosure, and the volume that a situation loads on its first read is limited."
    origin:
