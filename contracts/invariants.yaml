    notes: "Scoped to the move to the trash that closes a conversion: removing the source is the second half of the write it was authorized with, not a second act. A standalone move to the trash or deletion stays approval-required. Testable as: the approval-gate list carries that exclusion, so the trashing after a conversion resolves to no separate gate."

  - id: INV-014
    statement: "A trashed Inbox item keeps its comment as an origin trail. No separate notification about an autonomous conversion is sent."
