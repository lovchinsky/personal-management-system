  - id: INV-049
    statement: "An App-triggered run receives exactly three MCP domains — App, Notion, GBrain — and no built-in tool except `Read` in the plugin directory (`contracts/canonical.yaml`, key `plugin_tools`). The perimeter is set by the pair `allowedTools` + `permissionMode: 'dontAsk'`: a call not covered by an allow rule reaches the `canUseTool` step, which is skipped under `dontAsk`, and is denied. `tools` leaves only `Read`, `disallowedTools` lists the remaining built-in tools by name as a second layer, and `strictMcpConfig: true` with `settingSources: []` keeps ambient configuration out of the run."
