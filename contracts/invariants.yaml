  - id: INV-211
    mvp20_ordinal: 11
    statement: "**Safety.** Material autonomous domain writes are executed only after the required approval and a recheck of the current state. Higher-Level changes and generalized personal patterns have a higher threshold of authorization and evidence. An explicit instruction from the person authorizes only the exact requested mutation."
    verifiable_by: eval
    test: app/test/eval/inv-211.eval.ts
    related: [INV-016, INV-026, INV-027, INV-034]
    notes: "The executor-side gate (approval required, state re-read before write) is ci-contract and is covered by INV-034/INV-026/INV-016. “An explicit instruction from the person authorizes only the exact requested mutation” is scope discipline in the model and cannot be gated mechanically — the Chat-path enforcement gap at the enforcement-boundary table in `docs/2-system.md` § “mode → toolset” is exactly this."

  - id: INV-212
    mvp20_ordinal: 12
    statement: "**Reliability.** Duplicate events, restarts, retries and missed events create no duplicates and lose no follow-through."
    verifiable_by: ci-contract
    test: app/test/integration/inv-212-continuation.spec.ts
    related: [INV-022, INV-030, INV-032, INV-035, INV-101, INV-102]
    notes: "The one ID over `docs/3-policy.md` § “Behavior under degradation and failures”: that section states the required behavior per failure mode without minting an ID per subsection, because each mode's enforceable contract already has one. Retry counts and profiles are mechanism (INV-032, INV-035), not policy. “Create no duplicates” applies to follow-through, that is, to the domain effect: delivery on the wire stays at-least-once by design, and an extra message is not a follow-through duplicate. A missed event is either a situation that arose without an event, or a thread resolution that Notion does not report: the first is woken by the periodic safety sweep (INV-101), the second is closed by resolved-thread reconciliation (INV-102); the named test covers a duplicate, a restart, a retry and both missed-event paths all the way to the continuation in the queue."


  - id: INV-213
