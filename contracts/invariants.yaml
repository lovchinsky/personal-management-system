    notes: "The contract test proves the second clause: the approvals capability refuses a proposal whose context is the chat, so `pending_actions` never holds one. The first clause — the proposal lives on as an Inbox item with a comment — is carried by the chat step `park_inbox_item` (capability `capture_park`), proven in `app/src/capture/capture.service.spec.ts` (a page in the Inbox database, then the comment on it); `app/src/mcp/server/chat-session.spec.ts` proves the chat applies it at once; `INV-313` proves that a chat has no tool to propose."

