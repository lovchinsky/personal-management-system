  - id: INV-078
    statement: "`platform/` imports no App module except the generated Prisma client: modules depend on it, not the other way around."
    origin:
      - docs/2-system.md § Module map
    verifiable_by: ci-contract
    test: app/test/contract/inv-078.spec.ts
    notes: "Imports are resolved with the App's own tsconfig, so `baseUrl`-rooted specifiers count as App code rather than packages. Specs under `platform/` are not scanned: the boundary is about code that ships in the image."

  - id: INV-079
    statement: "The run trace — the `run_traces` ledger, the snapshot and the lists — is read and written only by `runs/`: the runner hands the run's outcome over through a port, and the dispatcher writes it into the trace."
    origin:
      - docs/2-system.md § Implementation inventory
    verifiable_by: ci-contract
    test: app/test/contract/inv-079.spec.ts
    related: [INV-304]
    notes: "The trace is every model whose name starts with `Run` in `app/prisma/schema.prisma`, read together with its `@@map` table; the list is checked against the generated client, so a trace table added later is covered without editing the check. Any path to those tables outside `app/src/runs/` counts: a Prisma delegate (`runTrace`, `runSnapshot`, … — including element access and destructuring), SQL literals naming a table in any case, or the ledger repository by name. Inside `runs/` the ledger may not be re-exported at all, so no alias can carry it out. The syntax tree is walked, so comments that mention the tables do not count."

  - id: INV-080
    statement: "Capability modules — continuation, delivery, approval, attention, conversion — export a service and at most one run source: the queue and the store stay inside, so every entry into a capability passes its checks."
    origin:
      - docs/2-system.md § Implementation inventory
    verifiable_by: ci-contract
    test: app/test/contract/inv-080.spec.ts
    related: [INV-079, INV-084]
    notes: "Read from Nest module metadata, not from source text: whatever the module lists in `exports` is what other modules can inject. Every export must be a `*Service`, except at most one `*RunSource`: a source of runs enqueues nothing — it hands rows that are already due to the scheduler, disposes of them after the run and prunes the concluded ones for maintenance. Nothing else is exported."

  - id: INV-081
    statement: "Only `notion/binding/` and `notion/semantics/` read the binding, and only `notion/client/property-id.ts` translates the shape of a property ID: the rest of the App sees canonical IDs and the description of the semantics, not the file format or the shape on the wire. `notion/workspace/` knows the format of the binding file in order to write it; the running App does not load this directory."
    origin:
      - docs/2-system.md § Implementation inventory
    verifiable_by: ci-contract
    test: app/test/contract/inv-081.spec.ts
    related: [INV-078, INV-080]
    notes: "Imports are resolved with the TypeScript resolver: outside the two owners only Nest module files under `notion/binding/` may be imported (DI wiring hands out no binding). `notion/workspace/` is the third place that imports the binding format, because it writes the file; the check also proves that no shipped file outside that folder imports it, so the running App never reaches it — only the `notion` command, whose entry point lives in the folder, and the gate do. Any appearance of `decodeURIComponent` or `decodeURI` counts — a direct call, a function reference passed to `.transform(...)` or `.map(...)`, or `globalThis.decodeURIComponent` — found by walking the syntax tree, so a comment that names them does not count."

  - id: INV-082
    statement: "Queue leases — `locked_until` — are written and compared only in `platform/queue/`: the owner fence, the lease release and the transition timestamp are implemented there once, not in every disposition of every queue."
    origin:
      - docs/2-system.md § Implementation inventory
    verifiable_by: ci-contract
    test: app/test/contract/inv-082.spec.ts
    related: [INV-078, INV-212]
    notes: "Outside `app/src/platform/queue/` no shipped file may name the lease: the Prisma field `lockedUntil` as an identifier (access, object literal, destructuring, type), or `locked_until` / `lockedUntil` inside a string or template literal in any case (SQL, `Pick<…, 'lockedUntil'>`, element access). The syntax tree is walked, so comments do not count. The check proves where the lease lives, not that every write to a queue row goes through that place: a new disposition that never names the lease — a status update by id alone, through Prisma or raw SQL — passes it unfenced. What exists is held by `app/test/integration/queue-protocol.spec.ts` (including caller predicates with `OR`, which the platform parenthesises), by `app/test/integration/run-row-source.spec.ts` — a zombie test per run-row disposition over the description of every run queue — and by the zombie tests of the delivery queue; in each, a stale token must change nothing. A disposition added later needs its own zombie test."

  - id: INV-083
    statement: "A JSON column in `app_db` is only a document: a value whose shape the App does not define, or a nested structure that its single reader consumes whole. A set of same-type records that the App or its metrics count, filter or join consists of table rows. The documents are listed in `contracts/canonical.yaml`, key `json_documents`."
    origin:
      - docs/2-system.md § Implementation inventory
    verifiable_by: ci-contract
    test: app/test/integration/inv-083.spec.ts
    related: [INV-017, INV-079]
    notes: "Held in two parts. Read from the applied database, not from `schema.prisma`: every `json`/`jsonb` column (arrays included) must be listed in `json_documents`, and every listed one must exist. And the shipped App source reads a document only whole: no Postgres path or containment operator on a column (`->`, `->>`, `#>`, `@>`, `<@`, `?`) and no Prisma JSON filter (`array_contains`, `string_contains` and their kin) — a set App filters or joins is rows of a table. Migrations moving data and specs are outside the scan. Whether a listed column is truly a document stays a judgement made when it is listed — the check makes the judgement explicit and reviewable, it cannot make it for you."

  - id: INV-084
    statement: "A run denial does not change the origin row — neither its time, nor its attempt counter, nor its status. A row that the denial finds claimed is released in the state in which it was taken."
    origin:
      - docs/2-system.md § Scheduler and outbox
    verifiable_by: ci-contract
    test: app/test/integration/inv-084.spec.ts
    related: [INV-080, INV-082, INV-085, INV-212]
    notes: "Needs the database, so it lives in the integration lane. Every gate is closed in turn — runner absent, runner not ready, plan quota, breaker, daily limit, slot taken — and a scheduler tick must leave each due row of both run sources byte-for-byte as it was apart from `updated_at`: `run_at` / `not_before`, `attempt_count`, `status`, `last_error`, no lease. The race case is held separately: a row claimed and then denied by admission comes back with the same moment, attempts and status, and no lease."

  - id: INV-085
    statement: "The scheduler takes due origins in the order of `run_priority`: the class, then fresh before retried, then the earlier time. The `autonomous` class is exactly the budgeted origins of `run_budget`."
    origin:
      - docs/2-system.md § Run priority
    verifiable_by: ci-contract
    test: app/test/contract/inv-085.spec.ts
    related: [INV-084, INV-304]
    notes: "Two halves, no database. The classification in code is compared with the contract (`contracts/canonical.yaml`, key `run_priority`) — class order, members, delegating and unscheduled origins — and every scheduled provenance (each non-delegating, scheduled origin; each `reason_code` under the delegating one) must land in the autonomous class exactly when `run_budget` calls it budgeted. The ordering itself is asserted over the comparator the scheduler sorts with: class first, then fresh before retried, then the earlier time."

  - id: INV-086
    statement: "Only `NotionWriter` calls the Notion write endpoints (comment, page creation and update, trash); it is one boundary that receives values already encoded by the adapter and checks the author of the response. Only `notion/workspace/` writes the schema — databases and data sources — and the running App does not load it (`INV-081`)."
    origin:
      - docs/2-system.md § System writes to Notion
    verifiable_by: ci-contract
    test: app/test/contract/inv-086.spec.ts
    related: [INV-008, INV-059, INV-060]
    notes: "The syntax tree of every shipped file outside `app/src/notion/client/notion.writer.ts` is walked for a call to a writing method of the Notion client — `pages.create`, `pages.update`, `pages.move`, `comments.create`, `blocks.*` except the reads, `dataSources.create/update`, `databases.create/update`, `fileUploads.*` — whatever the receiver is called. Reads (`retrieve`, `list`, `query`, `users.me`) stay free. A raw `fetch` to `api.notion.com` counts as a write path too. The one exception is `app/src/notion/workspace/`, which writes the schema — `dataSources.update`, `databases.create`, `databases.update` and nothing else; the check walks that folder separately, so a page write there fails it. The folder is reached by the `notion` command, whose entry point lives in it, and by the gate, never by the running App (INV-081)."

  - id: INV-087
    statement: "Intake classifies an event by its authors: when all authors are the integration bot with its id, the event is the system's own write; anything else is a person's change. While the bot's identity is unknown, classification refuses and the provider redelivers."
    origin:
      - docs/2-system.md § Webhook intake
    verifiable_by: ci-contract
    test: app/test/integration/inv-087.spec.ts
    related: [INV-018, INV-086]
    notes: "Needs the database: the receipt lifecycle is the observable. A matrix of author sets is pushed through intake — only our bot; our bot and a person; a person; a foreign bot; a bot without id; no authors at all — and only the first is rejected as own. With the identity unknown the receipt ends `failed` (the provider retries) and no window is opened."

  - id: INV-088
    statement: "An App run does not write to Notion before a valid result: it makes system writes to Notion only through the App, and they are applied together with the other App effects."
    origin:
      - docs/2-system.md § App MCP
    verifiable_by: ci-contract
    test: app/test/integration/inv-088.spec.ts
    related: [INV-035, INV-053, INV-086]

  - id: INV-089
    statement: "The system manages a discussion if it has commented in it or if a continuation or proposal is open on it; a person's reply in a managed discussion is a `managed_discussion_reply` run, and a comment outside a managed discussion is an ordinary page change."
    origin:
      - docs/2-system.md § System-managed attention episodes
    verifiable_by: ci-contract
    test: app/test/integration/inv-089.spec.ts
    related: [INV-085, INV-087]

  - id: INV-090
    statement: "App MCP tools have closed input schemas: a field the schema does not recognize gets a refusal, not silence."
    origin:
      - docs/2-system.md § App MCP
    verifiable_by: ci-contract
    test: app/test/contract/inv-090.spec.ts
    related: [INV-303]

  - id: INV-091
    statement: "The rules of a run row — recording an attempt, refunding it, the attempt limit — live only in `runs/` and `platform/queue/`: outside them there is neither SQL that writes `attempt_count` or `last_attempt_at` nor a read of the limit `work_row_max_attempts`. The run queue provides a description and does not repeat the rules."
    origin:
      - docs/2-system.md § Scheduler and outbox
    verifiable_by: ci-contract
    test: app/test/contract/inv-091.spec.ts
    related: [INV-080, INV-082, INV-084]
    notes: "The syntax tree of every shipped file outside `app/src/runs/` and `app/src/platform/queue/` is walked: a string or template literal naming `attempt_count` or `last_attempt_at` in any case counts, and so does the identifier or string `workRowMaxAttempts`. Comments do not count. The Prisma field `attemptCount` read as a value is not a rule and is allowed — the delivery queue computes its backoff from it."

  - id: INV-092
    statement: "Only App MCP tools and a capability's wire module (`*.wire.ts`) see the wire shape of App MCP input: outside them no parameter has a wire type. A capability service accepts the domain shape from a tool and from any other caller alike."
    origin:
      - docs/2-system.md § App MCP
    verifiable_by: ci-contract
    test: app/test/contract/inv-092.spec.ts
    related: [INV-080, INV-090]
    notes: "The syntax tree of every shipped file outside `app/src/mcp/server/` and `*.wire.ts` is walked: a parameter of a function, method, constructor or arrow whose type names an identifier ending in `Wire` counts, also inside a union, an array or a type argument. A return type or an interface field does not: the capability hands back its view of the answer itself."

  - id: INV-093
    statement: "Settings arrive typed, from the config namespace of the owning module: nobody imports `ConfigService` in App code, and only the config namespace factories (`*.config.ts`) and the entry point `app.module.ts` read the environment."
    origin:
      - docs/2-system.md § Configuration contract App
    verifiable_by: ci-contract
    test: app/test/contract/inv-093.spec.ts
    related: [INV-060, INV-078, INV-080]
    notes: "The syntax tree of every shipped file under `app/src/` (generated code excluded) is walked: an import specifier naming `ConfigService` counts anywhere, and `process.env` or `process['env']` counts outside `*.config.ts` factories, and `app.module.ts` (it decides whether to read `.env` from `NODE_ENV` before any namespace exists). Comments do not count. The gate is a test, not App code: `app/test/gate/gate-boot.ts` sets the environment of its own App instance before importing it, and its static imports never reach `app.module.ts`."

  - id: INV-094
    statement: "The rules of the methodology are pure functions over the records that were read: `methodology/` has no Nest providers and does not access Notion, `app_db`, the network, the clock or randomness. It imports only the types of the read record and itself, and for an unread, absent or unknown field it answers `undetermined` instead of guessing."
    origin:
      - docs/2-system.md § Module map
    verifiable_by: ci-contract
    test: app/test/contract/inv-094.spec.ts
    related: [INV-002, INV-003, INV-055, INV-081]
    notes: "The syntax tree of every shipped file under `app/src/methodology/` is walked: a package, a Node module or a file outside the module and the three semantics type files (`reading`, `decoded-record`, `canonical-status`) counts, a value import from those three counts (only `import type` is allowed), and so do a Nest decorator and a network, process-environment, clock or randomness call. The «undetermined» half is held by a matrix of reading states (`app/test/fixtures/reading-matrix.ts`, run by `app/src/methodology/reading-states.spec.ts`): every rule over every field it reads, in each of `absent`, `unread`, `gap`, `non_canonical` and `empty`, with the answer written out literally. `empty` is «nothing there» (an empty link is `none`, a project without tasks is `settled`), not `undetermined`; `non_canonical` (`Hidden`) is deliberately `out_of_scope`, outside the model. A rule added to the layer without a matrix row, or a matrix row naming no rule, fails the test. «Nothing is left» (`settled`, `clear`, `none`) is only as fresh as the read: a project's `Tasks` link is the other side of a synced relation, and the answer is complete only when every task of it was read. The layer is stateless selection over canonical readings, never a model of its own: what the sweep, the gate and the evals ask of it they ask of fresh reads (INV-003)."

  - id: INV-095
    statement: "Only the App names the wake reason `resolution_reconciliation`, through `requestClosure`: no step that requests a continuation — run or chat — names it, and the wire schema does not offer it. A row with this reason wakes `closure_processing`, not a recheck."
    origin:
      - docs/2-system.md § Resolution
    verifiable_by: ci-contract
    test: app/test/contract/inv-095.spec.ts
    related: [INV-019, INV-020, INV-089]
    notes: "Three clauses are held: `ContinuationsService` refuses the reason for every actor kind (both `check` and `schedule`); the wire schema of `schedule_continuation` does not list it; the row's envelope carries mode `closure_processing`. `requestClosure` is the only way to set it, and it only inserts: the closure has its own slot beside the thread's wake-up, so it never moves an existing row and a second request while it is open changes nothing."

  - id: INV-096
    statement: "The `closure_processing` mode writes only memory, through an App intent (`memory_record`): it reads Notion and GBrain, and the rest of its App tools are reads."
    origin:
      - docs/2-system.md § mode → toolset
    verifiable_by: ci-contract
    test: app/test/contract/inv-096.spec.ts
    related: [INV-055, INV-095]
    notes: "Held from the contract's own tool names, not from a copy of the row: the Notion and GBrain bundles are `read` only; the one system-voice tool of the row is `record_memory`, and every other tool behind its App bundles is a `get_`/`list_` read. «Only a decision the person made, a fact they stated or a significant event, with its source» is held by the frame and gate M7, not by a tool list."

  - id: INV-097
    statement: "A canonical anchor is a GBrain page that follows the `gbrain_anchor_shape` convention: the slug `<type prefix>/<notion_id without hyphens>`, frontmatter with exactly `type` (one of `gbrain_anchor_types`), `title`, `notion_id` in the hyphenated canonical form and `aliases`, and in the body an identity line with the same id. Building a page from a description and parsing a page into a description are mutually inverse."
    origin:
      - docs/2-system.md § Canonical anchors
    verifiable_by: ci-contract
    test: app/test/contract/inv-097.spec.ts
    related: [INV-098, INV-099]
    notes: "Held by the pure builder and parser in `app/src/knowledge/`: a page the builder produces parses back to the same description with no violations, and the parser names each way a page falls short (a missing or undashed `notion_id`, an `id` key, a type that does not match the slug prefix, a body without the identity line). The code constants (prefixes, forbidden keys, the identity-line label) are compared with `gbrain_anchor_shape`. That GBrain really indexes the identity line, and indexes nothing of the frontmatter, is a fact of the pinned GBrain: the gate M7 preflight measures it against the live stack, so a GBrain upgrade that changes it fails there."

  - id: INV-098
    statement: "An anchor's exact identity has three states: `absent`, `exact` and `integrity_error`. The candidates are pages of the anchor types that the search by id in the hyphenated form marked as an exact match, and the page at the object's conventional address, if there is one (search lags behind a write); a candidate becomes the anchor when `frontmatter.notion_id` matches the id in the canonical form. Two pages whose `notion_id` matches the id in the canonical form yield `integrity_error`, and the memory intent about the object answers with a refusal. A memory entry about an object lands on its single anchor; when there is no anchor and the conventional address is free, the App creates the anchor by convention together with the entry, and when a different page is at the address, a deleted one as well, the intent answers with a refusal. Identity is established by the equality of `notion_id`."
    origin:
      - docs/2-system.md § Exact identity
      - docs/3-policy.md § Multiple exact GBrain anchors
    verifiable_by: ci-contract
    test: app/test/contract/inv-098.spec.ts
    related: [INV-097, INV-099, INV-211]
    notes: "The resolver in `app/src/knowledge/` is a pure function over what GBrain answered: search hits (with their `evidence`) and the pages read. It reads the page at the object's conventional address besides the exact hits, because the search index lags behind a write; it ignores a hit that is not an exact match, a page of a type that is not an anchor type, a deleted page and a page whose `notion_id` differs (a lesson that merely mentions the id); it never picks among two. Where an entry lands is the pure placement over the same reads — the anchor, a new anchor at a free conventional address, or a refusal — and App's memory intent applies it one object at a time, reading the written anchor back. `SCEN-19-38` is this invariant on the two-anchor input. That the model follows the same steps when it reads is measured by gate M7, not asserted here."

  - id: INV-099
    statement: "The GBrain knowledge rules are pure functions over the pages that were read: `knowledge/` imports only itself, the parsing schemas (`zod`), the frontmatter serialization (`yaml`), the canonical form of the Notion id and the base class of App errors, and everything it knows about GBrain, Notion, `app_db`, time and randomness arrives as arguments."
    origin:
      - docs/2-system.md § Module map
    verifiable_by: ci-contract
    test: app/test/contract/inv-099.spec.ts
    related: [INV-094, INV-055]
    notes: "Same walk over the syntax tree as INV-094 (the impure-expression list is shared with it): a package other than `zod` and `yaml`, a Node module or a file outside the module, the Notion identifier helper and the base class of App errors counts, so do a Nest decorator and a network, process-environment, clock or randomness call. The layer answers questions about pages that were just read, and it is not an App MCP tool: what a person does through GBrain MCP, App MCP does not repeat (INV-055)."

  - id: INV-100
    statement: "GBrain write authority (`memory_writes`) matches the mode toolsets: a run authority other than `none` is possible for exactly those capabilities that have `mode_toolsets` rows, and `autonomous_gbrain_fact` and `autonomous_gbrain_lesson` from `capture_policy` are the same statements in the form of standing authorization. The generalization thresholds (`memory_thresholds`) in the Skill are the same as in the contract."
    origin:
      - docs/3-policy.md § Closure processing and memory policy
    verifiable_by: ci-contract
    test: app/test/contract/inv-100.spec.ts
    related: [INV-096, INV-213, INV-016]
    notes: "Held by comparing four places that carry the same fact: the `memory_writes` rows, the expansion of `mode_toolsets` bundles into App and GBrain capabilities, `capture_policy`, and the numbers the Skill states for the thresholds. A kind performed by a native GBrain capability has no run authority: runs record memory only through App. The gate's constant listing the GBrain writes a run must not make (`FORBIDDEN_GBRAIN_WRITES`) is every tool of the GBrain `write` bundle. «Only what the person said» and «a source for every entry» stay judgements of the frame and the gate scenarios; the tool list holds what it can (INV-096)."

  - id: INV-101
    statement: "The sweep writes only `safety_recheck` continuations with no thread, and memory about them: it writes nothing to Notion, to delivery or to proposals, and asserts nothing about the domain."
    origin:
      - docs/2-system.md § Periodic safety sweep
    verifiable_by: ci-contract
    test: app/test/integration/inv-101.spec.ts
    related: [INV-017, INV-020, INV-094, INV-212]
    notes: "Held two ways: a pass over staged candidates of every rule changes exactly `scheduled_checks` (rows with `safety_recheck` and no thread) and `sweep_marks`, counted over every App table; and no file of `app/src/sweeps/` imports the Notion writer, delivery, the executor, capture or memory. Which situations deserve a wake-up is the rules' business (INV-094), and what to do about one is the run's."

  - id: INV-102
    statement: "Closure is requested only for a thread in which the system has commented and whose thread anchor and last system comment are known: it is not among the unresolved threads listed for that anchor, and the system's comment has not been deleted. A repeat request is made only after the thread has been seen open again."
    origin:
      - docs/2-system.md § Resolved-thread reconciliation
    verifiable_by: ci-contract
    test: app/test/integration/inv-102.spec.ts
    related: [INV-089, INV-095, INV-212]
    notes: "Notion stands in for the comment reads; the registry, the continuation queue and the reconciliation memory are the real database. A thread on a block is listed by its block, since a page listing does not show it; an unreadable comment reads as a deleted thread; a row without a known comment is never asked about. «Seen open» includes the moment the system last wrote into the thread, so a thread resolved before the first tick still closes. That the thread was really resolved rather than deleted the closure run checks itself, reading the thread with its resolved comments."

  - id: INV-103
    statement: "A scheduled review has one occurrence per period, keyed by the period in the installation's time zone and not by an instant, so a producer retry, a restart, a clock change and an edit of the time in the schedule produce no second occurrence and lose none."
    origin:
      - docs/2-system.md § Schedule and recurrence
    verifiable_by: ci-contract
    test: app/test/integration/inv-103.spec.ts
    related: [INV-080, INV-085]
    notes: "The producer is ticked against the real database with a stated `now`: many ticks within one period, a daily schedule across both Kyiv transitions (a skipped and a doubled hour), and a schedule whose time changes mid-period. The unique index over (mode, period key) holds it under a race too; `schema-shape.spec.ts` checks that it exists. A schedule time inside the skipped hour moves forward, one inside the doubled hour is taken at its first instant (`docs/2-system.md` § “Schedule and recurrence”)."

  - id: INV-104
    statement: "Only a proposal shown by a delivered Daily Control packet expires: when the next Daily Control occurrence is scheduled, every still-`proposed` proposal shown by the `proposals` fields of sent Daily Control packets expires — and nothing else."
    origin:
      - docs/2-system.md § Approval differs by who performs the write
    verifiable_by: ci-contract
    test: app/test/integration/inv-104.spec.ts
    related: [INV-023, INV-026, INV-103]
    notes: "The producer, delivery and approvals are real over the database: a proposal in a sent daily packet lapses, one in a failed daily packet, in a weekly packet or in no packet stays, an approved one is untouched, an older day's packet counts, and lapsing happens when a new daily occurrence is placed, not on every tick. That a daily review actually puts open proposals into its packet is the frame's and gate M8's business; the structure (`proposals`, at most three, rendered uncut with their buttons) is what makes «shown» checkable."

  - id: INV-105
    statement: "The person is told exactly once about a review occurrence that did not take place: a `failed` occurrence — both after exhausted attempts and when retired past the window — yields one message with a delivery key per review and period, while an occurrence that took place and one that is still waiting yield none."
    origin:
      - docs/2-system.md § Schedule and recurrence
    verifiable_by: ci-contract
    test: app/test/integration/inv-105.spec.ts
    related: [INV-103, INV-023]
    notes: "The run source that retires occurrences, the producer and the delivery queue are real over the database: a window write-off and an exhausted attempt limit each give one outbox row with its reason, later ticks add nothing, and a lost mark after the enqueue repeats the same key instead of a second message. The wording of the message is the unit spec's business (`review-failure.message.spec.ts`)."

  - id: INV-106
    statement: "When the App itself writes to the person, it uses only texts from the catalog of the installation's language, and every catalog is complete and fits within the channel limits: the worst-case message of each language passes the queue and fits into one message, proposal fates fit into the reserve for a proposal, captions and replies fit their own limits. Outside the catalogs the App code has no Ukrainian string literal, and a catalog imports only types."
    origin:
      - docs/2-system.md § Language of texts for the person
    verifiable_by: ci-contract
    test: app/test/contract/inv-106.spec.ts
    related: [INV-024, INV-105]
    notes: "Completeness is the compiler's (`satisfies Texts` in each catalog); the test holds what the compiler cannot see, for every language in `LANGUAGES`: worst-case notices (the longest reason, client name and period label) pass the queue schema and have no excess, each outcome mark fits `OUTCOME_UNITS`, the escaped link label fits `LINK_LABEL_UNITS`, button labels and callback answers fit their bounds. A TypeScript scan finds Cyrillic string literals outside `src/texts/`, skipping tagged templates (`Prisma.sql` carries SQL comments for readers); it sees only Ukrainian, which is the point. The reply marker is a protocol, not a text, and is checked against the Skill files that quote it."

  - id: INV-107
    statement: "A proposal's fate is recorded in its thread as a system write exactly once per transition: the person's decision — approval or rejection — and the non-execution of what was approved; execution and expiry are not written to the thread. The message about the proposal is rewritten by the same step, not by the button-press handler."
    origin:
      - docs/2-system.md § Approval differs by who performs the write
    verifiable_by: ci-contract
    test: app/test/integration/inv-107.spec.ts
    related: [INV-023, INV-024, INV-026]
    notes: "Needs the App database: the published fate is a column of `pending_actions`, and «once per transition» is held by marking it after the Notion write, so a retry after a failed write writes again and a retry after a marked one does not."

  - id: INV-108
    statement: "The person is told exactly once about a wake whose time the person named (`user_snooze`, `deadline_followup`) and that did not take place: a `failed` wake yields one message with the delivery key that the run of that wake would have set, with its thread and page, sent regardless of quiet hours. A reminder the run managed to queue stays the only one, while a wake whose time the system chose, and wakes that are not retired, yield no message."
    origin:
      - docs/2-system.md § Scheduler and outbox
    verifiable_by: ci-contract
    test: app/test/integration/inv-108.spec.ts
    related: [INV-084, INV-105]
    notes: "The run source that retires wake-ups, the worker, the delivery service and the queue are real over the database: an exhausted snooze gives one outbox row keyed like the run's own delivery, later ticks add nothing, a lost mark after the enqueue repeats the same key, and a reminder the run had already queued keeps its content. The wording and the local moment are the unit spec's business (`wake-failure.message.spec.ts`)."

  - id: INV-109
    statement: "A run that did not reach Notion writes nothing and sets no continuations, and the App retries the same run: the attempt is refunded, and the same row waits out a pause that grows with the time it has spent waiting consecutively; other rows, including those of the same group, carry on as usual. A change to the row and a run that reached Notion lift the wait; a row that has waited longer than the limit no longer waits — an ordinary failure follows, which the breaker sees; a person's snooze never waits. The pause and the limit are set by policy (`docs/3-policy.md` § “Notion unavailability”)."
    origin:
      - docs/2-system.md § Scheduler and outbox
    verifiable_by: ci-contract
    test: app/test/integration/inv-109.spec.ts
    related: [INV-082, INV-084, INV-085, INV-108, INV-301]
    notes: "The scheduler, dispatcher, gates, ledger and run sources are real over the database; only the model run and the App side of it are stood in: a deferred run leaves a discarded session, no continuation and a ledger row without a reset moment, its row waits while a later row of the same group runs, a run that reached Notion releases the pauses (each row at most once per streak) but keeps each row's first deferral, a person's event in the window and a moved continuation clear the wait, a row that waited a day fails as an ordinary failure, and a snooze fails without waiting. What counts as «did not reach Notion» is the classifier's (`run-classifier.spec.ts`, `init-check.spec.ts`), the pause SQL and the fence are `run-row-source.spec.ts`."

# ---------------------------------------------------------------------------
# INV-201..INV-221 — release criteria. No `origin`: this registry owns their wording.
# INV-2NN == SCEN-20-NN == `mvp20_ordinal: NN`. Each of the 21 criteria is stated
# here in full: docs/4-acceptance.md cites these IDs and carries none of this text
# itself.
# ---------------------------------------------------------------------------

  - id: INV-201
    mvp20_ordinal: 1
    statement: "**Proactivity.** Relevant Notion changes and the passage of time start a cognitive cycle without manual review. An unfinished situation has a reliable continuation path."
    verifiable_by: integration
    test: app/test/integration/inv-201.spec.ts
    related: [INV-018, INV-020]
    notes: "Reads as an acceptance scenario (the system works end to end) more than a standing invariant; encoded in full because this registry owns their wording. Needs live Notion webhooks plus the scheduler; the scheduler half alone is ci-contract."

  - id: INV-202
    mvp20_ordinal: 2
    statement: "**Methodology conformance.** The MVP uses the canonical Levels, object types, statuses, lifecycles and decision rules of the canonical methodology. Physical properties outside the canonical model do not become domain entities and do not acquire semantics by name."
    verifiable_by: ci-contract
    test: app/test/contract/inv-202.spec.ts
    related: [INV-038, INV-077, INV-206, INV-207]
    notes: "Canonical enum conformance is assertable. The physical workspace carries properties with no canonical home; the invariant forbids reading meaning into them, not their existence."

  - id: INV-203
    mvp20_ordinal: 3
    statement: "**Data ownership.** Current management and operational state live in Notion. Durable attention interaction lives in discussions. Long-term knowledge lives in GBrain. App persistence contains only technical/runtime continuity state."
    verifiable_by: manual
    test: null
    same_as: [INV-050, INV-051, INV-052]
    related: [INV-017, INV-046]
    notes: "One sentence restating INV-050, INV-051 and INV-052 plus the discussions clause. Kept as its own entry because the INV-2xx band owns its wording; the enforceable test lives on INV-052/INV-017."

  - id: INV-204
    mvp20_ordinal: 4
    statement: "**Attention cardinality.** Several independent attention episodes can exist at the same time on one canonical Notion object. Their identity is the native `discussion_id`."
    verifiable_by: ci-contract
    test: app/test/contract/inv-204.spec.ts
    related: [INV-020]
    notes: "Assertable against the app_db schema: attention episodes (`scheduled_checks`) are keyed by `discussion_id`: the active-continuation indexes of a thread are per discussion (one wake-up and one closure each). The one per-page index, `scheduled_checks_one_active_per_page_reason`, holds only rows with no thread yet (`discussion_id IS NULL`), one per page and reason, so it never limits the threads on a page. `evaluation_windows` is unique per open page, but a window is a debounce carrier, not an attention episode."

  - id: INV-205
    mvp20_ordinal: 5
    statement: "**Operating loop.** Capture stores input without premature classification; Clarify determines the nature of the object and the workflow; Organize & Align writes to the correct store without an artificial hierarchy; Engage uses Calendar and Available Now; Reflect reads the current state; Adapt changes course according to evidence and authorization."
    verifiable_by: eval
    test: app/test/eval/inv-205.eval.ts
    related: [INV-010, INV-011, INV-012]
    notes: "A behavioural description of the whole loop; every clause is a property of model output. Encoded in full because this registry owns their wording."

  - id: INV-206
    mvp20_ordinal: 6
    statement: "**Execution model.** A Task has one of seven canonical statuses; time fields do not replace the status; Available Now contains only eligible `Next Action` Tasks after Project/context constraints."
    verifiable_by: ci-contract
    test: app/test/contract/inv-206.spec.ts
    related: [INV-004, INV-005, INV-006]
    notes: "“Time fields do not replace the status” is the broad form of INV-006; the seven-status enum and the Available Now eligibility filter are additional substance, so it stands as its own invariant beside INV-006."

  - id: INV-207
    mvp20_ordinal: 7
    statement: "**Change mechanisms.** A Project and a Behavior System are different L1 mechanisms. A Project has five canonical statuses; a Behavior System has five lifecycle states, separate from Routine/Habit automaticity. A Behavior System is the definition of a behavior; a Task is a single execution of it."
    verifiable_by: ci-contract
    test: app/test/contract/inv-207.spec.ts
    related: [INV-202, INV-009]

  - id: INV-208
    mvp20_ordinal: 8
    statement: "**Direction model.** An Area of Focus has a `Mode`; the `Standard` accumulates in the course of review and is not a condition for usefulness; Objective/Key Result is used for meaningful change, not ordinary maintenance; a completed Project is not evidence of an achieved Key Result."
    verifiable_by: eval
    test: app/test/eval/inv-208.eval.ts
    related: [INV-009, INV-207]
    notes: "Clause 1 (`Mode` exists as a closed set) is ci-contract. “Meaningful change, not ordinary maintenance” and the rule that a completed Project is not evidence of a Key Result are reasoning rules and need a model. Classified by the weakest clause."

  - id: INV-209
