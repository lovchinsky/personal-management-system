    verifiable_by: ci-contract
    test: app/test/contract/inv-028.spec.ts
    related: [INV-025, INV-056]
    notes: "The named list is mechanically assertable. “or their equivalents” is not — that tail is covered by INV-025 (manual). Gate M3 requires it green (criterion 5). `record_memory` is not an equivalent of `write_gbrain_fact` or `append_gbrain_timeline`: it takes canonical terms — the Notion object, the kind of entry, the words, the source — and the App finds the anchor, creates it by convention and shapes the entry; the model names no page, field or GBrain operation (ADR 0035)."

