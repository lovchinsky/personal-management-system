# Personal Management System invariant registry
#
# Purpose: one permanent ID per invariant, plus the binding that says how each one
# is checked. Section numbers move when documents are reorganized; INV-xxx never does.
# This file is the only place IDs are assigned.
#
# Per entry
#   statement       the invariant, in English
#   origin          the live section that states it normatively
#   verifiable_by   what a check needs:
#                     ci-contract  no model and no service beyond the App's own database
#                     eval         a model, over a replay dataset
#                     integration  services beyond the App's own database (GBrain, Notion,
#                                  a delivery provider) or a real workspace
#                     manual       human judgment
#   test            where the check lives: an existing file that names this ID, or the
#                   planned place of a check not yet written, named after this ID
#                   (`inv-NNN.*`). `null` exactly for `manual` entries and restatements
#                   (`same_as`). The path follows `verifiable_by`: ci-contract — a
#                   contract or unit spec, or `app/test/integration/` when the check
#                   needs the database; eval — `app/test/eval/*.eval.ts`; integration —
#                   `app/test/integration/`.
#                   Read `verifiable_by: ci-contract` as "checkable without a model",
#                   never as "checked".
#   related         other entries that constrain the same thing
#   same_as         this entry restates that one; the test lives on the other ID
#   mvp20_ordinal   INV-2NN only: NN, the criterion's number — the NN of SCEN-20-NN
#
# `app/test/contract/registry.spec.ts` holds these rules and prints the census —
# entries per lane and how many have an existing check — in its title.
#
# ID bands — a band is a range of IDs, and an ID never moves between bands
#   INV-001..INV-041  domain and adapter rules, and the core runtime, runner and Skill rules
#   INV-042..INV-109  component boundaries, interfaces, deployment and App mechanisms
#   INV-201..INV-221  release criteria. These carry no `origin`: no document states
#                     them, so this registry owns their wording. INV-2NN is the NNth
#                     criterion, which is what lets SCEN-20-NN map to it with no
#                     lookup table. Four restate a core entry — see `same_as`.
#   INV-301..INV-315  App-triggered runner, Skill layer, the Chat path and the channel reply
#
# WARNING (ordinal binding): INV-2NN, SCEN-20-NN and `mvp20_ordinal: NN` name one
# criterion. A new criterion takes the next free NN; an existing one keeps its NN even
# if the release criteria are reordered — the number is an identity, not a position.
# Never renumber.

summary:
  # Counts per lane: `app/test/contract/registry.spec.ts` prints them from the entries below.

  open_contradictions: []

invariants:

# ---------------------------------------------------------------------------
# INV-001..INV-041 — domain and adapter rules, and the core runtime, runner and Skill rules
# ---------------------------------------------------------------------------

  - id: INV-001
    statement: "An unknown status value yields `schema_gap`; an ambiguous date context yields `ambiguous_input`. No default is substituted, and none of the readings is silently chosen. A value is unknown when it belongs neither to the canonical set nor to the known non-canonical register. An empty page body yields no error — it is the capability `empty` under `INV-009`."
    origin:
      - docs/3-policy.md § Handling absent semantics
    verifiable_by: ci-contract
    test: app/test/contract/inv-001.spec.ts
    related: [INV-009, INV-041]
    notes: "Two disjoint sets, so INV-041 is not an exception to this rule: the adapter recognises a value either as canonical or as registered non-canonical, and only a value in neither set raises. `knownNonCanonical` in the adapter interface is that register. Testable as three cases: canonical value maps, registered non-canonical value maps to nothing and raises nothing, anything else raises."

  - id: INV-002
    statement: "The capability set is available to the model through the App MCP. A detector does not assert semantics whose representation is `absent`."
    origin:
      - docs/3-policy.md § Handling absent semantics
    verifiable_by: eval
    test: app/test/eval/inv-002.eval.ts
    notes: "Split verification: clause 1 (capability set reachable via `get_schema_mapping`) is ci-contract; clause 2 (“A detector does not assert semantics whose representation is `absent`”) is a property of model output and needs a model run. Classified by the weakest clause."

  - id: INV-003
    statement: "The adapter is access configuration. Current property values are always read from Notion and are not cached as domain state."
    origin:
      - docs/2-system.md § Physical schema and semantic interpretation
    verifiable_by: ci-contract
    test: app/test/contract/inv-003.spec.ts
    related: [INV-052, INV-077]
    notes: "Assertable as: adapter config holds IDs only, no property-value cache; app_db has no property-value table. The named test proves the first half: every page read goes to Notion, and there is no cache. The second half (the database has no column that would hold a property value) is checked by `app/test/integration/schema-shape.spec.ts` against the live database."

  - id: INV-004
    statement: "`Date` and `Deadline` are independent: each is read from its own property, and a Task can carry both. The status determines what `Date` means, not which field is filled in."
    origin:
      - docs/2-system.md § `Date` and `Deadline`
    verifiable_by: ci-contract
    test: app/test/contract/inv-004.spec.ts
    related: [INV-005]
    notes: "The independence of the fields is the core of ADR 0010: a `Scheduled` Task carries its own `Deadline`. The table that interprets `Date` by status lives in `docs/2-system.md` § “`Date` and `Deadline`”."

  - id: INV-005
    statement: "After a write, a Task does not have the status `Next Action` and a `Date` at the same time: both writing a date to a `Next Action` Task and moving a Task that has a date into `Next Action` are rejected (a move together with clearing the date is allowed). `Deadline` does not depend on the status."
    origin:
      - docs/2-system.md § `Date` and `Deadline`
    verifiable_by: ci-contract
    test: app/test/contract/inv-005.spec.ts
    related: [INV-004]
    notes: "Meaning depends on the status/`Date` interpretation table in `docs/2-system.md` § “`Date` and `Deadline`”. The check judges the result of the write: the status and `Date` the request names, and for the half it does not name, what the page already holds. A write that names neither status nor `Date` is not checked, so a page the person left with a `Date` on `Next Action` stays writable for other fields. A move into `Next Action` with the `Date` cleared in the same write passes. Refusal splits by cause: both halves in the request mean the request is wrong for any page (execution `failed`); one half on the page means it is wrong for this page only (execution `conflict`)."

  - id: INV-006
    statement: "The presence of a `Deadline` does not change the status. A `Next Action` with a `Deadline` remains `Next Action`."
    origin:
      - docs/2-system.md § `Date` and `Deadline`
    verifiable_by: ci-contract
    test: app/test/contract/inv-006.spec.ts
    related: [INV-206]
    notes: "INV-206 “Execution model” states the same rule more broadly (“time fields do not replace the status”); kept separate because INV-206 bundles two further claims."

  - id: INV-007
    statement: "When the input is ambiguous (is “Friday” the `Date` or the `Deadline`?), the model clarifies instead of guessing."
    origin:
      - docs/2-system.md § `Date` and `Deadline`
    verifiable_by: eval
    test: app/test/eval/inv-007.eval.ts
    notes: "Explicitly about model behavior — “the model clarifies instead of guessing”. No model-free test exists: it sits in the `eval` lane, which `npm test` does not gate (GAP-18)."

  - id: INV-008
    statement: "The App does not write to the page body — neither the parser nor system writes do. The person changes the body, on their own or through Claude in the chat."
    origin:
      - docs/2-system.md § Page body
    verifiable_by: ci-contract
    test: app/test/contract/inv-008.spec.ts
    related: [INV-034, INV-086]
    notes: "Assertable over the one write boundary (INV-086 keeps every other write path out): `NotionWriter` calls no block endpoint and sends none of the body fields a page request accepts — `children`, `content`, `markdown`, `erase_content`. The chat half (“through Claude in the chat”) is the Chat-path enforcement gap that `docs/2-system.md` § “mode → toolset” concedes: held by Skill instruction plus post-hoc trace review, not by a gate."

  - id: INV-009
    statement: "An empty page body → capability `empty` for all prose semantics of this record: the carrier exists and holds nothing. This is not `absent`: the absence of a carrier is declared by the binding, and that absence is a property of the type, not of the record. An enum value that belongs neither to the canonical set nor to the known non-canonical register → `schema_gap`."
    origin:
      - docs/2-system.md § Page body
    verifiable_by: ci-contract
    test: app/test/contract/inv-009.spec.ts
    related: [INV-001, INV-041]
    notes: "Scoped like INV-001: the register of known non-canonical values sits alongside the canonical set, and only a value in neither raises. Prose semantics share one carrier — the page body is read whole, so capability is determined per record, not per field."

  - id: INV-010
    statement: "An Inbox item has no status property and no processed flag. There is no third state."
    origin:
      - docs/3-policy.md § Resolvability model
    verifiable_by: ci-contract
    test: app/test/contract/inv-010.spec.ts
    notes: "Assertable against the Inbox model in code. Conformance of the live Notion Inbox data source to this shape is integration-only (see INV-077)."

  - id: INV-011
    statement: "There is a single cycle. Clarify is not repeated over what is already resolved."
    origin:
      - docs/3-policy.md § Resolvability model
    verifiable_by: ci-contract
    test: app/test/contract/inv-011.spec.ts

  - id: INV-012
    statement: "Capture does not depend on the availability of the model."
    origin:
