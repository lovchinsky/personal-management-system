  - id: INV-031
    statement: "`model` and `effort` are set explicitly in the options of every run and are not left on the CLI default: the default drifts with the version of the SDK package, so a run that relies on it changes behavior together with a package upgrade."
    origin:
      - docs/2-system.md § `RunProfile`
    verifiable_by: ci-contract
    test: app/test/contract/inv-031.spec.ts
    notes: "Assertable over the options builder, with no model and no live run: every run's options carry an explicit `model` and `effort`. Which canonical model the alias then resolves to is a fact about the run and is asserted from the trace — INV-033."

  - id: INV-032
    statement: "There is no fallback to another model. When the model is unavailable, the run fails with no partial effects and is retried with the same profile. This rule is about the model; lowering `effort` to a supported level is an SDK resolution on a different axis and does not fall under it."
    origin:
      - docs/2-system.md § `RunProfile`
    verifiable_by: ci-contract
    test: app/test/contract/inv-032.spec.ts
    notes: "“The same profile” means the same per-run options: `model` plus `effort` (`low`…`max`) and the tool budgets — the retry reuses that object as is and substitutes no model. The two are separate fields in `RunProfile` rather than one “depth” setting exactly because they resolve differently: the model axis has no fallback, while the SDK resolves an `effort` the active model does not support down to the highest level at or below it. A contract test that read effort resolution as a forbidden fallback would fail on every run where model and requested level disagree, so the test asserts the model axis only."

  - id: INV-033
    statement: "The `modelUsage` of every run is asserted in the trace: the profile's model is present with the same `canonicalModel` and did the main work. Auxiliary CLI entries (a smaller model for utility calls) are not a fallback."
    origin:
      - docs/2-system.md § `RunProfile`
    verifiable_by: ci-contract
    test: app/test/contract/inv-033.spec.ts
    related: [INV-031]
    notes: "Assertable over trace fixtures: a terminal run whose trace lacks the field, or carries a canonical model other than the profile's, fails the check. Setting `model` explicitly in the first place is INV-031."

  - id: INV-034
    statement: "On detector-driven paths the Notion MCP only reads: the allow-sets of the modes on these paths list no Notion write tool, so `permissionMode: 'dontAsk'` denies them; `disallowedTools` removes them from Claude's view as a second layer. The system writes the comment through the App, and a material domain write goes through `pending_actions`."
    origin:
      - docs/2-system.md § mode → toolset
    verifiable_by: ci-contract
    test: app/test/contract/inv-034.spec.ts
    related: [INV-008, INV-049, INV-211]
    notes: "Per-mode toolset resolution is assertable against the options object and against the session `init` message, which enumerates the tools actually attached — the two must agree. The enforcement-boundary table in `docs/2-system.md` § “mode → toolset” states outright that the Chat path is NOT mechanically enforced: it is a user-authorized session the App does not configure, so this contract test does not cover it. The capture path of App-triggered `dialogue` is covered: it reads Notion like every other row and converts Inbox items through App."

  - id: INV-035
    statement: "The SDK validates the evaluation result through `outputFormat: { type: 'json_schema' }`, and the App validates it once more with its own schema; a run without a valid `structured_output` is a failure, and the failure is reported by `is_error` and `terminal_reason`, not by `subtype`. An invalid or missing structured output leaves no App effects: this run's App MCP writes are not applied, the failure goes to the trace, and the retry stays within the attempts of the origin row."
    origin:
      - docs/2-system.md § Result validation
    verifiable_by: ci-contract
    test: app/test/contract/inv-035.spec.ts
    related: [INV-210, INV-212]
    notes: "The schema is emitted from the zod result model at draft-07 (`z.toJSONSchema(s, { target: 'draft-7' })`) because the SDK rejects newer drafts — the canonical result shape (`contracts/canonical.yaml`, key `evaluation_result`) has to stay expressible there. The CLI does not enforce `format` keywords, hence the App's own zod pass. The schema holds content as well as shape (ADR 0033): `type` is one of `detector_labels`, `evidence` and `counterevidence_checked` are non-empty with non-empty items, `outcome` is snake_case. The CLI enforces `enum`, `minItems` and `pattern` and answers a violation with a tool error the model corrects inside the run; exhausted retries fail the run. The SDK answers an unauthenticated run and an unavailable model with `subtype: success` and `is_error: true`, so the contract test covers it explicitly. App effects are staged and applied only after a valid result (ADR 0014); the system writes Notion and GBrain memory only through the App, so those writes wait for the same verdict (INV-088, ADR 0035)."

  - id: INV-036
    statement: "Every `evidence` ref matches an object read by a tool call in the same run."
    origin:
