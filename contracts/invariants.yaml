# ---------------------------------------------------------------------------
# INV-301..INV-315 — docs/2-system.md: App-triggered runner, Skill layer, the Chat path
# and the channel reply. These are normative rules of those sections that no INV-0xx/INV-2xx entry
# covers. `origin` names the section, not a line: docs/2-system.md is live and its
# lines move.
# ---------------------------------------------------------------------------

  - id: INV-301
    statement: "A failed MCP server connection throws no error: the status of each of the three servers arrives in the run's init message. The runner checks the statuses before trusting the result; a run that started without `connected` on a required server — Notion or App, `contracts/canonical.yaml`, key `mode_toolsets.required_servers` — is never a run with the outcome `no_action`: it is a technical failure, and when the only init problem is that Notion is currently not responding (`failed`, `pending`), it is a deferral, after which the App retries the same run (`INV-109`). Revoked access (`needs-auth`) and a disabled server are always a failure. GBrain degrades: without it the run continues, and the trace records this."
    origin:
      - docs/2-system.md § Runner MCP connections
    verifiable_by: ci-contract
    test: app/test/contract/inv-301.spec.ts
    related: [INV-034, INV-035, INV-049, INV-061, INV-302]
    notes: "The gate is a pure function of the `init` message and the mode→toolset requirement, so it is assertable over init fixtures: a `failed` or `needs-auth` status on a server the mode needs is an init problem, never a `no_action` result; a Notion `failed`/`pending` that is the only problem is the deferral (`notionUnavailableAtInit`), anything else a technical failure. Observing a real `needs-auth` — an expired Notion OAuth grant — is integration and belongs to INV-061."

  - id: INV-302
    statement: "The tool surface is closed in the run's effective configuration, not only in intent: `tools` in the init message contains no built-in tool except `Read` in the plugin directory, and no name outside `mcp__app__*`, `mcp__notion__*`, `mcp__gbrain__*` other than the declared harness tools (`contracts/canonical.yaml`, keys `harness_tools` and `plugin_tools`). The `query()` options set the intent; an organization's managed policy can only narrow it."
    origin:
      - docs/2-system.md § Tool surface boundaries
    verifiable_by: ci-contract
    test: app/test/contract/inv-302.spec.ts
    related: [INV-034, INV-040, INV-049]
    notes: "Two App-side artifacts, no model and no live run needed: the options object (INV-049 states it) and the `init` message's `tools` array. The init check is the one that catches a perimeter the options object alone would not show — a name present in `init` but outside the three `mcp__*` prefixes, the harness tools and `Read` fails it. A vendor tool the contract does not know is denied and the start repeated once (`ADR 0031`)."

  - id: INV-303
    statement: "No App MCP tool result exceeds the threshold beyond which the CLI writes the result to a file and replaces it with an error containing the file name: the run's `MAX_MCP_OUTPUT_TOKENS` and the ~100 KB limit for persisting output. `Read` in a run is limited to the plugin directory (`INV-311`), so Claude cannot read that file: every App MCP tool has a declared response bound within both thresholds, and where the bound can truncate a collection, the response says that the collection was truncated. This is a requirement on App MCP tools, not on the Skill's instructions."
    origin:
      - docs/2-system.md § Tool surface boundaries
    verifiable_by: ci-contract
    test: app/test/contract/inv-303.spec.ts
    related: [INV-028, INV-049, INV-302]
    notes: "Assertable over the App MCP tool registry: every tool declares a bound on its result, every bound fits both the run's `MAX_MCP_OUTPUT_TOKENS` and the CLI's persisted-output size, and data-dependent bounds are checked against their worst case. Whether a live payload stays under the bound is integration; the bound itself is a design property of each tool and is checkable without a model. The bounds live in the App MCP tool table (`app/src/mcp/server/tools/`), the same table the server registers tools from."

  - id: INV-304
    statement: "`query()` spawns one subprocess per run (≈1 GiB) and has no upper session timeout, so the App enforces the bound through four mechanisms: its own queue with limited concurrency, `maxTurns`, `maxBudgetUsd` and its own `AbortController`. The number of concurrent runs is a parameter of the App, not a consequence of how many triggers arrive at once."
    origin:
      - docs/2-system.md § Runner execution environment
    verifiable_by: ci-contract
    test: app/test/contract/inv-304.spec.ts
    related: [INV-031, INV-032, INV-212]
    notes: "The subprocess itself has no upper bound: a run without these four would cost as much memory and time as the CLI chose to take. All four bounds are App-side properties: the queue has a configured concurrency limit, every `RunProfile` carries `maxTurns` and `maxBudgetUsd`, and each run is started with an abort handle. How the host behaves under a real webhook burst is integration — this entry is the contract that the burst is bounded at all."

  - id: INV-305
    statement: "The production App image does not install dependencies with `npm ci --omit=optional`: the SDK's bundled CLI binary arrives through npm optional dependencies and is pinned to the SDK package version, so an image built without optional dependencies does not contain the binary and the runner does not start in it. The image contains exactly one binary — the one for its own libc: `npm ci` selects it by the `os`, `cpu` and `libc` recorded in the lockfile."
    origin:
      - docs/2-system.md § Runner execution environment
    verifiable_by: ci-contract
    test: app/test/contract/inv-305.spec.ts
    related: [INV-074, INV-075]
    notes: "Assertable statically against the checked-in lockfile and Dockerfile: no `--omit=optional` or `--no-optional` flag, every platform package pinned to the `@anthropic-ai/claude-agent-sdk` package version, and every `*-musl` / non-musl pair carrying a `libc` field. The `libc` field is the load-bearing part and is easy to lose: npm writes it only on a resolution from scratch by npm 11 or newer, and never backfills it into an existing lockfile, so a lockfile refreshed by an older npm silently drops it and doubles the image. That the built image actually starts the runner is integration, the same split as INV-065's deployed-endpoint half."

  - id: INV-306
    statement: "The run's environment equals the declared set."
    origin:
      - docs/2-system.md § Run invocation
    verifiable_by: ci-contract
    test: app/test/contract/inv-306.spec.ts
    related: [INV-301, INV-305]
    notes: >-
      Assertable over the env object the runner builds, with no model and no live run: its key
      set equals the declared set. The `env` option replaces the process environment rather
      than merging into it, so that set is the whole environment the subprocess sees, and the
      run's authentication is determined by it.

  - id: INV-307
    statement: "An `allowedTools` entry names a specific tool or a narrow prefix within a single server. A whole server name — `mcp__notion__*` — is never an allow entry. A run's allow-set equals the row of its mode in the mode → toolset matrix."
    origin:
      - docs/2-system.md § Tool surface boundaries
    verifiable_by: ci-contract
    test: app/test/contract/inv-307.spec.ts
    related: [INV-034, INV-049]
    notes: >-
      Assertable over the options object with no model and no live run: every `allowedTools`
      entry matches `mcp__<server>__<name>` with a non-empty name segment, and the set equals
      the tools the mode's row in the matrix names. A bare-server entry auto-approves every
      tool that server exposes now and every one it adds later, which `INV-302`'s prefix check
      cannot distinguish from an intended one — the shape rule is what keeps that check
      meaningful. The server segment must stay glob-free because the SDK ignores an unanchored
      allow entry with a startup warning.
  - id: INV-308
    statement: "The Skill refers to a capability, not to a tool name. Tool names differ between the Chat path and the App-triggered path, so a behavior tied to a literal tool name is not reproduced on one of the paths."
    origin:
      - docs/2-system.md § Skill layer contract
    verifiable_by: ci-contract
    test: app/test/contract/inv-308.spec.ts
    related: [INV-302, INV-307]
    notes: >-
      Assertable statically over the Skill source with no model and no live run: no Skill file of
      either plugin contains an `mcp__` token. The plugin loader scopes its servers as
      `mcp__plugin_<plugin-name>_<server>__<tool>`, account connectors carry names the client
      assigns, and the programmatic run uses `mcp__<server>__<tool>`, so a literal tool name can be correct on at most one path.
      This is what lets one knowledge source serve both surfaces, which `path-parity rate` measures.

  - id: INV-309
    statement: "A dead Notion MCP grant is a `runner_not_ready` denial that comes before budget and admission: there is no ledger row, the origin row's attempt is not spent, and the breaker does not see a run denied for this reason."
    origin:
      - docs/2-system.md § Observability and cost
    verifiable_by: ci-contract
    test: app/test/contract/inv-309.spec.ts
    related: [INV-061, INV-084, INV-301]
    notes: "Assertable over the dispatcher and the runner port with no database and no live grant: a runner whose readiness reports a missing or expired grant makes `dispatch` answer `runner_not_ready` before the budget is consulted and before admission writes a ledger row, and before the row's attempt is recorded. Whether the grant is alive is the grant's own judgement (`NotionMcpGrant`): not authorized, past its inactivity limit or past its ceiling."

  - id: INV-310
    statement: "The token that Claude Chat uses to talk to the App MCP is issued by the App for this endpoint: the token's audience is `APP_MCP_URL`, the client's `redirect_uri` comes only from the allowlist (the claude.ai and claude.com callbacks and loopback, ignoring the port), PKCE S256 is mandatory, the authorization code is single-use and short-lived, access and refresh tokens live in `app_db` only as hashes, and the refresh token is rotated: an old one, presented a second time, revokes the whole family."
    origin:
      - docs/2-system.md § Authentication boundary
    verifiable_by: ci-contract
    test: app/test/contract/inv-310.spec.ts
    related: [INV-065, INV-313]
    notes: >-
      Assertable over the OAuth server without a model or a live client: a client registered
      with a redirect URI outside the allowlist is refused, a code redeems once, the audience
      of an issued token is the declared MCP URL, no table column holds a token in clear, and a
      replayed refresh token revokes its family. That the real claude.ai and Claude Code
      clients complete the flow against the public endpoint is integration, by hand.

  - id: INV-311
    statement: "The only built-in tool of an App-triggered run is `Read`, and it is limited to the plugin directory: a successful read of a file outside it is a run failure, no matter which allow entry the CLI gave. A denied attempt is not a failure."
    origin:
      - docs/2-system.md § Tool surface boundaries
    verifiable_by: ci-contract
    test: app/test/contract/inv-311.spec.ts
    related: [INV-049, INV-302, INV-308]
    notes: >-
      Two layers, both assertable without a model: the allow rule is `Read(//<plugin dir>/**)`
      for every mode, and the stream observer fails a run whose `Read` outside the plugin
      directory succeeded — an absolute path outside it, a `..` escape or a relative path — while
      a denied attempt is the perimeter working. That the CLI itself denies reads outside the
      directory is a property of the pinned CLI; gate M3 proves it against the live stack for an
      absolute path outside the directory, and does not exercise a symlink or a `..` escape.

  - id: INV-312
    statement: "A person's reply in the channel to a system message is written to Notion — as a quoting comment by the bot in the thread the message belongs to — before any step of the model, and only then is the evaluation window opened. Neither the run's trigger envelope nor `app_db` carries the content of the reply. Text that is not a reply to a system message is not accepted: the channel is meant only for a dialogue that the system starts."
    origin:
      - docs/2-system.md § Telegram — channel adapter
    verifiable_by: ci-contract
    test: app/test/contract/inv-312.spec.ts
    related: [INV-012, INV-024, INV-030]
    notes: >-
      Assertable over the reply consumer with fakes for the thread and the window repository: the
      Notion comment precedes the window, the window carries identifiers only, and the consumer
      imports nothing from the runner, so a missing model cannot lose the reply. A reply whose
      Notion write fails opens no window: when Notion is unavailable the person is told at once to
      send it later and the receipt is settled rejected (ADR 0045), and if even that answer fails —
      or the write failed otherwise — the receipt stays retryable, so the provider's redelivery
      repeats the work. A reply that belongs to no thread writes nothing and is settled rejected
      with a named reason.

  - id: INV-313
    statement: "The toolset of App tools on the Chat path contains neither `add_comment` (the person's voice in the chat goes through the Notion MCP) nor `create_pending_action`: a proposal from the chat left unanswered in the same turn stays an Inbox item (`INV-015`)."
    origin:
      - docs/2-system.md § mode → toolset
    verifiable_by: ci-contract
    test: app/test/contract/inv-313.spec.ts
    related: [INV-015, INV-053, INV-310]
    notes: >-
      Assertable over `chat_toolset` in `contracts/canonical.yaml` and its mirror in
      `app/src/runs/toolsets.ts`: neither capability is granted. The Chat path's Notion and
      GBrain toolset is the user's, so this is the one half of the Chat toolset the App can hold
      mechanically.

  - id: INV-314
    statement: "**The Skill is an instruction for an agent, not a copy of the norms.** The text of the Skill is read by a model that does not know the project: it contains no implementation requirements, acceptance criteria, register gaps, references to norms and decisions, design rationales or negations of its own identity; every rule is stated in one place. The behavior a norm requires is ensured by the implementation, not by a reminder in the text."
    origin:
      - docs/2-system.md § Decomposition
    verifiable_by: ci-contract
    test: app/test/contract/inv-314.spec.ts
    related: [INV-037, INV-038, INV-308]
    notes: >-
      Assertable only in part: the test scans every Skill file for markers of author
      context (norm and registry references, builder requirements, acceptance wording,
      mechanism words, identity by negation, words the Skill does not use). Narrating a
      change is held by `app/test/contract/final-state.spec.ts`.
      Whether each remaining sentence changes the agent's behaviour or gives a fact it cannot
      read from its tools stays an editorial judgement, as in `INV-037`.

  - id: INV-315
    statement: "**A surface has its own entry; knowledge knows nothing of the surface.** The Chat entry does not speak of runs, the run entry does not speak of Chat, and the knowledge both read speaks of neither. “In Chat… in a run…” inside one file means there are too few files, not that the agent has to be told how it was launched."
    origin:
      - docs/2-system.md § Decomposition
    verifiable_by: ci-contract
    test: app/test/contract/inv-315.spec.ts
    related: [INV-037, INV-314]
    notes: >-
      Assertable only in part: the test scans each entry's files for the markers of the other
      surface (envelope, staged writes, the word Chat) and the shared knowledge for both. A file that avoids the words and still describes how the agent is
      started stays an editorial judgement, as in `INV-314`.
